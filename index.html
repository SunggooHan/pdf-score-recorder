<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>PDF Score Recorder MVP</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>PDF Score Recorder</strong>
      <span>MVP</span>
    </div>
    <div class="status" id="status">PDF를 불러오세요</div>
  </header>

  <main class="app-shell">
    <section class="toolbar" aria-label="PDF and recording controls">
      <label class="file-button">
        PDF 선택
        <input id="pdfInput" type="file" accept="application/pdf" />
      </label>

      <div class="control-group">
        <button id="prevBtn" type="button" disabled>이전</button>
        <span class="page-indicator">
          <input id="pageInput" type="number" min="1" value="1" disabled />
          <span>/</span>
          <span id="pageCount">0</span>
        </span>
        <button id="nextBtn" type="button" disabled>다음</button>
      </div>

      <div class="control-group">
        <button id="zoomOutBtn" type="button" disabled>-</button>
        <button id="fitBtn" type="button" disabled>맞춤</button>
        <button id="zoomInBtn" type="button" disabled>+</button>
      </div>

      <div class="control-group grow">
        <label for="scrollSpeed">자동 스크롤</label>
        <input id="scrollSpeed" type="range" min="0" max="80" value="0" step="5" />
        <span id="scrollSpeedText">꺼짐</span>
      </div>

      <div class="control-group recording-controls">
        <button id="cameraBtn" type="button">카메라 켜기</button>
        <button id="recordBtn" type="button" class="record" disabled>녹화 시작</button>
      </div>
    </section>

    <section class="viewer-wrap" id="viewerWrap">
      <div class="empty-state" id="emptyState">
        <h1>PDF 악보를 선택하세요</h1>
        <p>악보를 띄운 상태에서 카메라/마이크로 연주 영상을 녹화할 수 있습니다.</p>
        <p class="hint">iPhone/iPad에서는 Safari에서 실행하고, 로컬 파일로 바로 열지 말고 localhost/HTTPS로 실행하세요.</p>
      </div>
      <canvas id="pdfCanvas" aria-label="PDF score canvas"></canvas>
    </section>

    <aside class="camera-panel" id="cameraPanel" aria-label="Camera preview">
      <div class="camera-header">
        <span id="recordingDot" class="dot"></span>
        <span id="cameraLabel">카메라 미리보기</span>
        <button id="togglePreviewBtn" type="button" title="미리보기 접기">접기</button>
      </div>
      <video id="cameraPreview" autoplay playsinline muted></video>
    </aside>

    <section class="result-panel" id="resultPanel" hidden>
      <div class="result-header">
        <strong>녹화 완료</strong>
        <button id="closeResultBtn" type="button">닫기</button>
      </div>
      <video id="playback" controls playsinline></video>
      <div class="result-actions">
        <a id="downloadLink" class="download" download>영상 다운로드</a>
        <button id="openVideoBtn" type="button">새 탭에서 열기</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
